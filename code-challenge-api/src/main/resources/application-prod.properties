spring.application.name=code-challenge

# Server Configuration - Azure uses PORT environment variable
server.port=${PORT:8080}

# PostgreSQL Database Configuration (Azure)
# Azure App Service will inject these via Environment Variables
spring.datasource.url=${AZURE_POSTGRESQL_CONNECTIONSTRING}
spring.datasource.username=${AZURE_POSTGRESQL_USER}
spring.datasource.password=${AZURE_POSTGRESQL_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration (Production)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# CORS Configuration - Allow Azure Static Web App
spring.web.cors.allowed-origins=${AZURE_FRONTEND_URL:https://your-app.azurestaticapps.net}

# Production optimizations
spring.jpa.open-in-view=false
