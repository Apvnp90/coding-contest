name: Deploy Frontend to Azure

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'code-challenge-ui/**'
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: code-challenge-ui/package-lock.json

    - name: Install dependencies
      run: |
        cd code-challenge-ui
        npm ci

    - name: Build React app
      run: |
        cd code-challenge-ui
        npm run build
      env:
        REACT_APP_API_URL: https://coding-contest-api-fqh8agb3gga3h7d2.canadacentral-01.azurewebsites.net

    - name: Deploy to Azure Static Web Apps
      uses: Azure/static-web-apps-deploy@v1
      with:
        azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
        repo_token: ${{ secrets.GITHUB_TOKEN }}
        action: 'upload'
        app_location: 'code-challenge-ui'
        output_location: 'build'
